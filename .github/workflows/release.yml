name: Release

on:
  push:
    tags:
      - 'v*'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions: write-all
    env:
      ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set Version
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          echo "VERSION=$version" >> $env:GITHUB_ENV
      - name: Setup Embedding Python
        uses: ./.github/actions/setup-python-build
      - name: Build App
        uses: ./.github/actions/build-app
        with:
          platform: win
          github_token: ${{ secrets.GITHUB_TOKEN }}
          main_vite_client_id: ${{ secrets.CLIENT_ID }}
          main_vite_client_secret: ${{ secrets.CLIENT_SECRET }}
      - name: Archive Release
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: zip
          directory: ./dist/win-unpacked
          filename: Portable EcuBus-Pro ${{ env.VERSION }}.zip
      - name: Stage Windows assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./dist/release-stage
          Copy-Item -Path "./dist/win-unpacked/Portable EcuBus-Pro *.zip" -Destination ./dist/release-stage/
          Copy-Item -Path ./resources/lib/ecb_cli.exe -Destination ./dist/release-stage/
          $exe = Get-ChildItem -Path ./dist -File -Filter "EcuBus-Pro *.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Copy-Item -Path $exe.FullName -Destination ./dist/release-stage/
      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: ./dist/release-stage/*
      - name: Upload to aliyun
        if: ${{ env.ALIYUN_ACCESS_KEY_ID != '' && env.ALIYUN_ACCESS_KEY_SECRET != '' }}
        run: node tools/upload.js --note --app

  build-linux:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set Version
        id: version
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          echo "VERSION=$version" >> $GITHUB_ENV
      - name: Setup Embedding Python
        uses: ./.github/actions/setup-python-build
      - name: Build App
        uses: ./.github/actions/build-app
        with:
          platform: linux
          github_token: ${{ secrets.GITHUB_TOKEN }}
          main_vite_client_id: ${{ secrets.CLIENT_ID }}
          main_vite_client_secret: ${{ secrets.CLIENT_SECRET }}
      - name: Stage Linux assets
        shell: bash
        run: |
          mkdir -p ./dist/release-stage
          cp ./resources/lib/ecb_cli ./dist/release-stage/
          cp "$(find ./dist -maxdepth 1 -name "*.deb" | head -n 1)" ./dist/release-stage/
          cp "$(find ./dist -maxdepth 1 -name "*.rpm" | head -n 1)" ./dist/release-stage/
      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: ./dist/release-stage/*

  build-mac:
    runs-on: macos-latest
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set Version
        id: version
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          echo "VERSION=$version" >> $GITHUB_ENV
      - name: Setup Embedding Python
        uses: ./.github/actions/setup-python-build
      - name: Build App
        uses: ./.github/actions/build-app
        with:
          platform: mac
          github_token: ${{ secrets.GITHUB_TOKEN }}
          main_vite_client_id: ${{ secrets.CLIENT_ID }}
          main_vite_client_secret: ${{ secrets.CLIENT_SECRET }}
      - name: Stage macOS assets
        shell: bash
        run: |
          mkdir -p ./dist/release-stage
          cp ./resources/lib/ecb_cli ./dist/release-stage/
          cp "$(find ./dist -maxdepth 1 -name "*.dmg" | head -n 1)" ./dist/release-stage/
      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: ./dist/release-stage/*

  publish-release:
    needs: [build-windows, build-linux, build-mac]
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set Version
        id: version
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          echo "VERSION=$version" >> $GITHUB_ENV
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: dist/win
      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: dist/linux
      - name: Download Mac Artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-artifacts
          path: dist/mac
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
      - name: Resolve Windows assets
        shell: bash
        run: |
          exe_path=$(find dist/win -maxdepth 1 -name "*.exe" ! -name "ecb_cli.exe" | head -n 1)
          zip_path=$(find dist/win -maxdepth 1 -name "*.zip" | head -n 1)
          echo "WIN_EXE_PATH=$exe_path" >> $GITHUB_ENV
          echo "WIN_EXE_NAME=$(basename "$exe_path")" >> $GITHUB_ENV
          echo "WIN_ZIP_PATH=$zip_path" >> $GITHUB_ENV
          echo "WIN_ZIP_NAME=$(basename "$zip_path")" >> $GITHUB_ENV
      - name: Upload Windows EXE
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.WIN_EXE_PATH }}
          asset_name: ${{ env.WIN_EXE_NAME }}
          asset_content_type: application/vnd.microsoft.portable-executable
      - name: Upload Windows ZIP
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.WIN_ZIP_PATH }}
          asset_name: ${{ env.WIN_ZIP_NAME }}
          asset_content_type: application/zip
      - name: Upload Windows CLI
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/win/ecb_cli.exe
          asset_name: ecb_cli.exe
          asset_content_type: application/vnd.microsoft.portable-executable
      - name: Resolve Linux assets
        shell: bash
        run: |
          deb_path=$(find dist/linux -maxdepth 1 -name "*.deb" | head -n 1)
          rpm_path=$(find dist/linux -maxdepth 1 -name "*.rpm" | head -n 1)
          echo "LINUX_DEB_PATH=$deb_path" >> $GITHUB_ENV
          echo "LINUX_DEB_NAME=$(basename "$deb_path")" >> $GITHUB_ENV
          echo "LINUX_RPM_PATH=$rpm_path" >> $GITHUB_ENV
          echo "LINUX_RPM_NAME=$(basename "$rpm_path")" >> $GITHUB_ENV
      - name: Upload Linux DEB
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.LINUX_DEB_PATH }}
          asset_name: ${{ env.LINUX_DEB_NAME }}
          asset_content_type: application/vnd.debian.binary-package
      - name: Upload Linux RPM
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.LINUX_RPM_PATH }}
          asset_name: ${{ env.LINUX_RPM_NAME }}
          asset_content_type: application/x-rpm
      - name: Upload Linux CLI
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/linux/ecb_cli
          asset_name: ecb_cli
          asset_content_type: application/octet-stream
      - name: Resolve Mac assets
        shell: bash
        run: |
          dmg_path=$(find dist/mac -maxdepth 1 -name "*.dmg" | head -n 1)
          echo "MAC_DMG_PATH=$dmg_path" >> $GITHUB_ENV
          echo "MAC_DMG_NAME=$(basename "$dmg_path")" >> $GITHUB_ENV
      - name: Upload Mac DMG
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.MAC_DMG_PATH }}
          asset_name: ${{ env.MAC_DMG_NAME }}
          asset_content_type: application/octet-stream
      - name: Upload Mac CLI
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/mac/ecb_cli
          asset_name: ecb_cli_mac
          asset_content_type: application/octet-stream
